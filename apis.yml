apis:
- aid: myome-api
  name: MyOme API
  description: 'Partner-facing REST API for MyOme''s clinical whole-genome laboratory. Clients list
    the sequencing and analysis Products available to them (identifiers prefixed PR), submit
    Requisitions for a sample (prefixed RQ) which fan out into one Order per Product (prefixed OR),
    poll requisition and order status through the SUBMITTED / AWAITING_SAMPLE / ANALYZING /
    CLINICIAN_REVIEW / COMPLETED lifecycle, and retrieve Reports including sequencing data,
    structured interpretation data and PDF reports via result links. The published OpenAPI 3.0.2
    document declares 63 paths but exposes operation detail for only 8 of them to anonymous
    callers; the remainder (patient portal, provider portal, institutional administration, billing)
    are listed as paths with their operations withheld pending partner authorization.'

aid: myome
name: MyOme
description: 'MyOme is a CLIA-certified and CAP-accredited clinical laboratory in Menlo Park,
  California that builds a whole-genome analysis platform for inherited disease risk. A single
  patient sample is sequenced once and re-interpreted over time to produce clinically actionable
  reports: Single-Gene Risk, Medication Response (pharmacogenomics), and cross-ancestry Integrated
  Polygenic Risk Scores (iPRS) for breast cancer, coronary artery disease, prostate cancer and type
  2 diabetes, alongside a rare-disease portfolio spanning genome, exome and copy-number analysis.
  MyOme publishes a partner-facing REST API (OpenAPI 3.0.2, version 2.51.0) at api.myome.com that
  lets institutional clients list orderable products, submit sequencing requisitions, track
  requisition and order status, and retrieve results including sequencing data, structured
  interpretation data and PDF reports. Authorization is bearer JWT issued by MyOme''s Keycloak at
  auth.myome.com using partner-specific credentials, and a separate external sandbox instance
  (api.sbx.myome.com) is published for partner testing and development.'

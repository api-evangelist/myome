domain_standards:
- id: npi
  name: NPI (CMS National Provider Identifier)
  conforms: true
  evidence: 'components.schemas.NPI: {"type":"string","title":"NPI","pattern":"^\\d{9,10}$"}. The NPI
    schema is referenced 42 times across the contract, on Clinician, PhysicianOfRecord and provider
    onboarding shapes. This is the US national registry identifier for healthcare providers, so a
    partner EHR or practice-management system can bind its own provider records to MyOme''s without a
    bilateral crosswalk.'
  spec_location: components.schemas.NPI
- id: clia
  name: CLIA laboratory certification number
  conforms: true
  evidence: 'components.schemas.CLIANumber: {"type":"string","pattern":"^\\d{2}D[A-Za-z0-9]{7}$"} —
    the CMS CLIA number format (two-digit state code, "D" facility-type letter, seven-character
    sequence). Carrying the ordering/performing laboratory''s CLIA number in the contract is what makes
    a result reportable under 42 CFR 493.'
  spec_location: components.schemas.CLIANumber

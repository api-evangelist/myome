clinical_risk_inputs:
  note: 'A large part of the schema surface is not an API data model at all but the clinical
    questionnaire that feeds MyOme''s risk engines, declared as first-class schemas: a full
    Tyrer-Cuzick breast-cancer input set (age_at_menarche, number_of_live_births, age_at_first_birth,
    menopausal_status, history_of_atypical_hyperplasia, history_of_lcis, breast_density_value_birads,
    polygenic_snp_score, ashkenazi_jewish, plus a TyrerCuzickFamilyHistory array), a coronary-artery-
    disease input set (SmokingStatus, TotalCholesterol, HDLCholesterol, SystolicBloodPressure,
    AntiHyperTensionMedicationUse, TriglycerideLevel), a type-2-diabetes set (FastingGlucoseLevel,
    BodyMassIndex, WaistCircumference, FirstDegreeFamilyWithType2Diabetes) and a prostate-cancer set.
    These are the integrated-PRS covariates, and they are the most distinctive thing in the contract.'
  families: [tyrer_cuzick_inputs, coronary_artery_disease_inputs, type_2_diabetes_inputs, prostate_cancer_inputs]

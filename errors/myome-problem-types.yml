divergence: 'The contract and the runtime disagree on the error envelope. Every 4xx declared in the
  spec $refs components.responses.StructuredError with media type application/json, but the live API
  answers application/problem+json with an RFC 9457 shape that adds a required `status` member and a
  `type` URI, and omits `code`/`errors`/`extra`. A client written to the spec will not find the fields
  it was told to expect on a gateway-level rejection. Recorded, not corrected.'
status_codes:
- code: 200
  meaning: Success
- code: 201
  meaning: Created — returned by a successful create along with the created object identifier.
- code: 204
  meaning: No Content
- code: 400
  meaning: Bad Request
- code: 401
  meaning: Unauthorized — no authorization token provided, or the JWT is expired/invalid.
- code: 403
  meaning: Forbidden
- code: 404
  meaning: Resource Not Found
- code: 415
  meaning: Unsupported Media Type
- code: 500
  meaning: Internal Server Error
problem_types: []
notes: 'MyOme publishes no error-code registry: `code` is declared as a free-form nullable string and
  the only value appearing anywhere in the specification is `validation_error`. There is no documented
  enumeration of problem types, so problem_types[] is deliberately empty rather than invented. The
  domain does carry status vocabularies that a client must handle as terminal outcomes even though
  they are not HTTP errors — ExternalOrderStatus DENIED / CANCELED / FAILED, with a nullable
  `status_reason` (e.g. SAMPLE_NOT_RECEIVED) and `status_message` on the order object.'

    description: Short human-readable summary of the problem type.
  - name: detail
    type: string
    description: Human-readable explanation specific to this occurrence.
  - name: code
    type: string
    nullable: true
    description: The type of error that occurred (e.g. validation_error).
  - name: errors
    type: object
    nullable: true
    description: Dictionary of field names to error messages; may nest one level for nested fields.
  - name: extra
    type: object|string
    nullable: true
  examples:
  - {title: Validation error, detail: There was an error validating the request}
  - {code: validation_error, title: Validation error, detail: Validation error, errors: {field1: field is required}}
- name: RFC 9457 problem detail
  where: what the gateway actually returns at runtime
